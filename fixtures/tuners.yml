- name: PT3-0
  types:
    - GR
    - BS
    - CS
  command: recpt1 --device /dev/pt3video0 <channel> - -

- name: DVB-C-0
  types:
    - GR
    - BS
    - BS4K
  command: recdvb --dev 0 <channel> - -
  tlvDecoder: tlvdecoder --arg1

- name: BS4K-0
  types:
    - BS4K
  command: recdvb --dev 1 <channel> - -
